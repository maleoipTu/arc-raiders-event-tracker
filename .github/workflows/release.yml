name: Release Windows app

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        default: v0.5.1
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Release tag does not match package version' }

      - name: Test quest dependency graph
        run: pnpm run quests:test

      - name: Build Windows installer
        run: pnpm exec electron-builder --win nsis --publish never

      - name: Publish release assets
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          gh release create $env:RELEASE_TAG `
            "dist/ARC-Event-Tracker-Setup-$version.exe" `
            "dist/ARC-Event-Tracker-Setup-$version.exe.blockmap" `
            "dist/latest.yml" `
            --title "ARC Event Tracker $version" `
            --generate-notes `
            --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
